name: Backend CD

on:
  workflow_run:
    workflows: ["Backend CI"]
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: join-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.JOIN_SSH_PRIVATE_KEY_B64 }}
          SSH_HOST: ${{ vars.JOIN_SSH_HOST }}
          SSH_HOST_KEY: ${{ vars.JOIN_SSH_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh

          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 --decode > ~/.ssh/join_deploy_key
          chmod 600 ~/.ssh/join_deploy_key

          printf '%s %s\n' "$SSH_HOST" "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh-keygen -y -f ~/.ssh/join_deploy_key > /dev/null

      - name: Deploy JOIN backend
        env:
          SSH_HOST: ${{ vars.JOIN_SSH_HOST }}
          SSH_USER: ${{ vars.JOIN_SSH_USER }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh \
            -i ~/.ssh/join_deploy_key \
            -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" \
            "DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'EOF'

          set -euo pipefail

          cd /opt/join/app

          git fetch origin main
          git checkout main
          git reset --hard "$DEPLOY_SHA"

          docker compose --env-file ../.env build web

          docker compose --env-file ../.env run --rm web \
            python manage.py migrate --noinput

          docker compose --env-file ../.env up -d --remove-orphans

          for attempt in $(seq 1 12); do
            if curl -fsS \
              -H "X-Forwarded-Proto: https" \
              http://127.0.0.1:8001/api/readiness/ > /dev/null; then

              echo "JOIN backend is ready."
              exit 0
            fi

            sleep 5
          done

          echo "JOIN backend did not become ready."

          docker compose --env-file ../.env ps
          docker compose --env-file ../.env logs --tail=100 web

          exit 1
          EOF

      - name: Verify public API
        run: |
          curl -fsS https://join-api.ahmet-balci.de/api/health/
          curl -fsS https://join-api.ahmet-balci.de/api/readiness/
