name: join-ci

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: join_ci
      POSTGRES_USER: join_ci
      POSTGRES_PASSWORD: join_ci
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U join_ci -d join_ci"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  test:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: django-insecure-ci-only-secret-not-for-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_LOG_LEVEL: INFO
      DJANGO_SECURE_SSL_REDIRECT: "False"
      DJANGO_SESSION_COOKIE_SECURE: "False"
      DJANGO_CSRF_COOKIE_SECURE: "False"
      DJANGO_TRUST_PROXY_SSL_HEADER: "False"
      DB_ENGINE: postgresql
      DB_NAME: join_ci
      DB_USER: join_ci
      DB_PASSWORD: join_ci
      DB_HOST: db
      DB_PORT: "5432"
      DB_CONN_MAX_AGE: "0"
      REDIS_URL: redis://redis:6379/0
      JOIN_TASK_CACHE_TIMEOUT: "30"
      JOIN_LOGIN_RATE: 10/min
      JOIN_REGISTER_RATE: 5/min
      JOIN_GUEST_RATE: 5/min
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        python -m pip check &&
        python manage.py makemigrations --check --dry-run &&
        python manage.py check &&
        python manage.py test
